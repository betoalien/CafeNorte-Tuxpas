[project]
name = "cafenorte-data-platform"
version = "0.1.0"
description = "Reproducible data engineering challenge for CaféNorte"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-core==1.9.8",
    "dbt-postgres==1.9.0",
    "polars==1.34.0",
    "pardox==0.3.4",
    "adbc-driver-postgresql==1.7.0",
    "psycopg[binary]==3.2.10",
    "pydantic==2.11.9",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project.scripts]
cafenorte = "cafenorte.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.13.2",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
per-file-ignores = { "src/cafenorte/ingest.py" = ["E501"], "tests/test_ingestion.py" = ["E501"], "src/cafenorte/export_answers.py" = ["E501"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
