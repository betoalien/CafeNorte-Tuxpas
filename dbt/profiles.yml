cafenorte:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', '127.0.0.1') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('DBT_USER', 'dbt') }}"
      password: "{{ env_var('DBT_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'cafenorte') }}"
      schema: analytics
      threads: 4
